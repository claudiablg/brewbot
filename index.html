<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kōban Coffee & Tea — AI Assistant</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-darkest: #1a1210;
    --bg-dark: #2a1d18;
    --bg-mid: #3d2a22;
    --bg-light: #4d3528;
    --cream: #f5e6d3;
    --cream-dim: #d4c0a8;
    --copper: #d4884a;
    --copper-bright: #e8a468;
    --amber: #f4b860;
    --bot-bubble: #3d2a22;
    --user-bubble: linear-gradient(135deg, #d4884a 0%, #c97a3d 100%);
    --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: radial-gradient(ellipse at top, #2a1d18 0%, #1a1210 100%);
    min-height: 100vh;
    color: var(--cream);
    display: flex;
    flex-direction: column;
    padding: 24px;
  }

  .header {
    text-align: center;
    margin-bottom: 24px;
    padding: 16px;
  }

  .header h1 {
    font-size: 28px;
    color: var(--cream);
    margin-bottom: 6px;
    letter-spacing: -0.5px;
  }

  .header h1 span { color: var(--copper-bright); }

  .header p {
    color: var(--cream-dim);
    font-size: 14px;
  }

  .chat-container {
    max-width: 480px;
    width: 100%;
    height: 640px;
    margin: 0 auto;
    background: var(--bg-dark);
    border-radius: 20px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid rgba(212, 136, 74, 0.15);
  }

  .chat-header {
    background: linear-gradient(135deg, var(--bg-mid) 0%, var(--bg-light) 100%);
    padding: 18px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid rgba(212, 136, 74, 0.2);
  }

  .avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--copper) 0%, var(--amber) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }

  .chat-header-info h2 {
    font-size: 15px;
    color: var(--cream);
    margin-bottom: 2px;
  }

  .chat-header-info .status {
    font-size: 12px;
    color: var(--cream-dim);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    background: #4ade80;
    border-radius: 50%;
    box-shadow: 0 0 8px #4ade80;
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
  }

  .messages::-webkit-scrollbar { width: 6px; }
  .messages::-webkit-scrollbar-track { background: transparent; }
  .messages::-webkit-scrollbar-thumb {
    background: var(--bg-light);
    border-radius: 3px;
  }

  .message {
    max-width: 80%;
    padding: 12px 16px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.5;
    animation: slideIn 0.3s ease-out;
    word-wrap: break-word;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .message.bot {
    background: var(--bot-bubble);
    color: var(--cream);
    align-self: flex-start;
    border-bottom-left-radius: 4px;
    border: 1px solid rgba(212, 136, 74, 0.1);
  }

  .message.user {
    background: var(--user-bubble);
    color: white;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
    box-shadow: 0 2px 8px rgba(212, 136, 74, 0.3);
  }

  .typing {
    align-self: flex-start;
    background: var(--bot-bubble);
    padding: 14px 16px;
    border-radius: 16px;
    border-bottom-left-radius: 4px;
    display: flex;
    gap: 4px;
    border: 1px solid rgba(212, 136, 74, 0.1);
  }

  .typing span {
    width: 7px;
    height: 7px;
    background: var(--copper-bright);
    border-radius: 50%;
    animation: bounce 1.4s infinite;
  }

  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  .quick-actions {
    padding: 0 20px 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .quick-btn {
    background: transparent;
    border: 1px solid rgba(212, 136, 74, 0.4);
    color: var(--copper-bright);
    padding: 8px 14px;
    border-radius: 18px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }

  .quick-btn:hover {
    background: rgba(212, 136, 74, 0.15);
    border-color: var(--copper-bright);
    transform: translateY(-1px);
  }

  .input-area {
    padding: 16px 20px;
    background: var(--bg-mid);
    border-top: 1px solid rgba(212, 136, 74, 0.15);
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .input-area input {
    flex: 1;
    background: var(--bg-darkest);
    border: 1px solid rgba(212, 136, 74, 0.2);
    color: var(--cream);
    padding: 12px 16px;
    border-radius: 24px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
  }

  .input-area input:focus { border-color: var(--copper); }
  .input-area input::placeholder { color: var(--cream-dim); opacity: 0.6; }

  .send-btn {
    background: linear-gradient(135deg, var(--copper) 0%, var(--amber) 100%);
    border: none;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s, box-shadow 0.2s;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(212, 136, 74, 0.3);
  }

  .send-btn:hover:not(:disabled) {
    transform: scale(1.05);
    box-shadow: 0 4px 12px rgba(212, 136, 74, 0.5);
  }

  .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .send-btn svg { width: 18px; height: 18px; fill: white; }

  .footer {
    text-align: center;
    margin-top: 24px;
    padding: 16px;
  }

  .footer-text {
    color: var(--cream-dim);
    font-size: 12px;
    opacity: 0.7;
  }

  @media (max-width: 520px) {
    body { padding: 12px; }
    .chat-container { height: calc(100vh - 200px); }
    .header h1 { font-size: 22px; }
  }
</style>
</head>
<body>
  <div class="header">
    <h1>Kōban <span>Coffee & Tea</span></h1>
    <p>Customer Support Chat</p>
  </div>

  <div class="chat-container">
    <div class="chat-header">
      <div class="avatar">☕</div>
      <div class="chat-header-info">
        <h2>Kōban Assistant</h2>
        <div class="status"><span class="status-dot"></span> Online</div>
      </div>
    </div>

    <div class="messages" id="messages"></div>

    <div class="quick-actions" id="quickActions">
      <button class="quick-btn" data-q="What are your best sellers?">☕ Best sellers</button>
      <button class="quick-btn" data-q="Tell me about your subscription plans">📦 Subscriptions</button>
      <button class="quick-btn" data-q="Can you give me brewing tips?">🍵 Brewing tips</button>
      <button class="quick-btn" data-q="How do I track my order?">🚚 Track order</button>
    </div>

    <div class="input-area">
      <input type="text" id="userInput" placeholder="Type your message..." autocomplete="off" />
      <button class="send-btn" id="sendBtn" aria-label="Send">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>

  <div class="footer">
    <p class="footer-text">Built with Vanilla JS, HTML &amp; CSS — Portfolio demo by Claudia Bélanger</p>
  </div>

<script>
  const WELCOME_MSG = "Hey! I'm Kōban's assistant. I can help with orders, subscriptions, brewing tips, and product recommendations. What can I help you with?";

  const FALLBACK = "Great question! Let me connect you with our team — you can reach us at hello@koban.co or use our live chat during business hours (9am-6pm EST).";

  const RULES = [
    {
      keywords: ['best seller', 'bestseller', 'popular', 'recommend'],
      reply: "Our best sellers right now are the Ethiopian Yirgacheffe and the Taiwanese Oolong. Both are customer favorites! Want me to tell you more about either one?"
    },
    {
      keywords: ['subscription', 'subscribe', 'plan', 'monthly'],
      reply: "We have two subscription plans: Coffee ($24/month for 2 bags of rotating single-origin) and Tea ($18/month for a curated box). You can pause or cancel anytime. Use code FIRSTBREW for 50% off your first month!"
    },
    {
      keywords: ['shipping', 'delivery', 'how long'],
      reply: "Free shipping on orders over $40! Standard delivery takes 3-5 business days, and express is 1-2 days for $12.99."
    },
    {
      keywords: ['return', 'refund', 'exchange'],
      reply: "We accept returns on unopened items within 14 days of delivery. Just email us at hello@koban.co with your order number and we'll take care of it."
    },
    {
      keywords: ['track', 'order', 'where'],
      reply: "You can track your order using the link in your confirmation email. If you can't find it, send us your order number and I'll look it up for you!"
    },
    {
      keywords: ['matcha'],
      reply: "Our Ceremonial Grade Matcha ($32/30g) is sourced from Uji, Kyoto. It's perfect for traditional preparation or matcha lattes. Sift 2g into a bowl, add 70ml of 175°F water, and whisk with a chasen until frothy!"
    },
    {
      keywords: ['brew', 'how to', 'prepare', 'recipe'],
      reply: "For pour-over, we recommend a 1:16 ratio (15g coffee to 240ml water) at 200°F. Bloom for 30 seconds, then pour slowly in circles over 3 minutes. Want tips for a specific brewing method?"
    },
    {
      keywords: ['gift', 'present'],
      reply: "We have curated gift sets starting at $35! Our most popular is the Coffee Explorer Box — 4 single-origin samples with tasting notes. Perfect for coffee lovers."
    },
    {
      keywords: ['price', 'cost', 'how much'],
      reply: "Our coffees range from $16-$18 per 250g bag, teas from $14-$32, and equipment from $25-$55. Want details on something specific?"
    },
    {
      keywords: ['hello', 'hi', 'hey'],
      reply: "Hey there! Welcome to Kōban. What can I help you with today?"
    }
  ];

  function findReply(text) {
    const lower = text.toLowerCase();
    for (const rule of RULES) {
      if (rule.keywords.some(k => lower.includes(k))) {
        return rule.reply;
      }
    }
    return FALLBACK;
  }

  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const quickActionsEl = document.getElementById('quickActions');

  function addMessage(role, text) {
    const div = document.createElement('div');
    div.className = `message ${role}`;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'typing';
    div.id = 'typing';
    div.innerHTML = '<span></span><span></span><span></span>';
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeTyping() {
    const t = document.getElementById('typing');
    if (t) t.remove();
  }

  function sendMessage(text) {
    if (!text.trim()) return;

    addMessage('user', text);
    inputEl.value = '';
    inputEl.disabled = true;
    sendBtn.disabled = true;
    showTyping();

    const delay = 1000 + Math.random() * 1000;
    setTimeout(() => {
      removeTyping();
      addMessage('bot', findReply(text));
      inputEl.disabled = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }, delay);
  }

  sendBtn.addEventListener('click', () => sendMessage(inputEl.value));
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMessage(inputEl.value);
  });

  quickActionsEl.addEventListener('click', (e) => {
    if (e.target.classList.contains('quick-btn')) {
      sendMessage(e.target.dataset.q);
    }
  });

  window.addEventListener('load', () => {
    setTimeout(() => addMessage('bot', WELCOME_MSG), 300);
    inputEl.focus();
  });
</script>
</body>
</html>
